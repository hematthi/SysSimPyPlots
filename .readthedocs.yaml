version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  fail_on_warning: true
  # Path to Sphinx configuration file:
  configuration: docs/source/conf.py

#formats:
#  - pdf

python:
  # Install our python package before building the docs
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
